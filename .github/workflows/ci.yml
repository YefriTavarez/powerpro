
name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-powerpro-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  bank-batch-isolated:
    name: Bank batch form and TXT regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python powerpro/payroll_rules/test_banco_popular.py
      - run: node --test tests/test_payroll_bank_batch_ui.cjs

  mixed-payroll-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Mixed-frequency payroll unit and controller contract tests
        run: python scripts/test_mixed_frequency_unit.py

  dietas-isolated:
    name: Dieta service and modal regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tests/test_dietas.py
      - run: npm ci --prefix tests
      - run: node --test tests/test_dietas_ui.cjs
      - run: node --check powerpro/public/js/dietas.js

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v3
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --frappe-branch version-15 --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        id: install_apps
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --branch version-15 erpnext
          bench get-app --branch version-15 hrms
          bench get-app powerpro $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app hrms
          bench --site test_site execute erpnext.setup.utils.before_tests
          bench --site test_site execute hrms.tests.test_utils.before_tests
          bench --site test_site install-app powerpro
          bench build
        env:
          CI: 'Yes'

      - name: Run Dieta Database Tests (isolated development fixture)
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site execute frappe.test_runner.make_test_records --kwargs '{"doctype":"Company", "commit":true}'
          env/bin/python apps/powerpro/scripts/test_dietas_dev.py --site test_site --sites-path /home/runner/frappe-bench/sites --confirm-development --require-complete

      - name: Run Payroll Tests
        if: ${{ !cancelled() && steps.install_apps.outcome == 'success' }}
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          failed=0
          run_module() { bench --site test_site run-tests --app powerpro --module "$1" || failed=1; }
          run_module powerpro.controllers.test_payroll_preflight
          run_module powerpro.controllers.test_overtime_cash_settlement
          run_module powerpro.controllers.test_overtime_settlement
          run_module powerpro.controllers.test_overtime_compensatory_settlement
          run_module powerpro.payroll_rules.test_dominican_republic
          run_module powerpro.payroll_rules.test_employer_contributions
          run_module powerpro.payroll_rules.test_banco_popular
          run_module powerpro.power_pro.doctype.payroll_bank_batch.test_payroll_bank_batch
          run_module powerpro.payroll_rules.test_overtime
          run_module powerpro.payroll_rules.test_overtime_work_call
          run_module powerpro.payroll_rules.test_overtime_compensatory
          run_module powerpro.payroll_rules.test_overtime_candidates
          run_module powerpro.payroll_rules.test_overtime_cash_settlement
          run_module powerpro.controllers.test_overtime_candidate_refresh
          run_module powerpro.power_pro.doctype.overtime_authorization.test_overtime_authorization
          run_module powerpro.power_pro.doctype.retroactive_overtime_adjustment.test_retroactive_overtime_adjustment
          run_module powerpro.patches.v1.test_setup_dgii_isr_2026
          exit "$failed"
        env:
          TYPE: server
