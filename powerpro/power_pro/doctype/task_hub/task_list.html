<h3>Lista de Tareas</h3>
<table class="table table-hover table-no-border">
    <thead>
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Proyecto</th>
            <th>Vence</th>
            <th>Estado</th>
            <th class="d-none d-md-block">Usuario</th>
            <th title="Acciones"></th>
        </tr>
    </thead>
    <tbody>
        {% for task in tasks %}
        <tr>
            <td style="white-space: nowrap">{{ task.id }}</td>
            <td>{{ task.title }}</td>
            <td style="white-space: nowrap">{{ task.project }}</td>
            <td style="white-space: nowrap">{{ task.due_date }}</td>
            <td style="white-space: nowrap">
                <span class="status-indicator status-{{ task.status }}"></span> 
                {{ capitalize(task.status) }}
            </td>
            <td class="d-none d-md-block">{{ task.user }}</td>
            <td title="Acciones">
                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle custom-dropdown-toggle" type="button" id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                       ⋮
                    </button>
                    <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                      <a class="dropdown-item" href="#">Action</a>
                      <a class="dropdown-item" href="#">Another action</a>
                      <a class="dropdown-item" href="#">Something else here</a>
                    </div>
                </div>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
